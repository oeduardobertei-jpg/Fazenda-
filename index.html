<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fazenda Viva 0.4.0</title>
<style>*{box-sizing:border-box}body{margin:0;background:#17271c;color:#fff;font:14px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:10px;left:10px;right:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px;pointer-events:none}.pill{background:#152d25e8;border:1px solid #7a9877;border-radius:12px;padding:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#bottom{position:fixed;bottom:12px;left:8px;right:8px;display:flex;gap:5px}button{background:#254d38;color:white;border:1px solid #93b58c;border-radius:9px;padding:12px 6px;flex:1;font:inherit}#panel{position:fixed;bottom:76px;left:8px;right:8px;background:#183628f2;border:1px solid #7a9877;border-radius:14px;padding:12px;max-height:50dvh;overflow:auto}#panel[hidden]{display:none}#actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}#status{position:fixed;top:102px;left:8px;background:#173b2bdc;padding:7px 10px;border-radius:8px;font-size:12px;pointer-events:none}#error{position:fixed;top:35%;left:12px;right:12px;background:#4a2828;border:2px solid orange;border-radius:12px;padding:15px}#error[hidden]{display:none}@media(max-width:450px){button{font-size:12px;padding:11px 3px}.pill{font-size:11px}}</style></head><body>
<canvas id="game"></canvas><div id="hud"><div class="pill">🐎 FAZENDA VIVA · 0.4.0</div><div class="pill" id="date">📅 Dia 1</div><div class="pill" id="money">💰 R$ 19.000</div><div class="pill" id="buildings">🏡 15 estruturas · 4 IAs</div></div><div id="status">Arraste para mover · Pinça para zoom · ⌖ recentra</div><div id="panel" hidden><h3>🌿 Construir na sua cabanha</h3><p>Selecione uma estrutura e toque em um terreno livre perto da sua fazenda.</p><div id="actions"><button data-type="stable">🐴 Cocheira · R$ 3.200</button><button data-type="paddock">🌱 Piquete · R$ 1.300</button><button data-type="barn">🚜 Galpão · R$ 2.400</button><button data-type="house">🏠 Casa · R$ 4.000</button></div><p id="news">Quatro fazendas vizinhas tomam decisões econômicas automaticamente.</p></div><div id="bottom"><button id="pause">⏸ Pausar</button><button id="speed">⏩ 1×</button><button id="focus">⌖ Fazenda</button><button id="toggle">☰ Construir</button></div><div id="error" hidden></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');if(!ctx){$('error').hidden=false;$('error').textContent='Seu navegador não oferece Canvas 2D.';return}
let W=0,H=0,dpr=1,zoom=2.7,panX=0,panY=0,paused=false,speed=1,day=1,acc=0,build=null,seed=314159;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};const owners=[{name:'Sua cabanha',x:-60,y:-45,cash:19000,ai:false,color:'#b78355'},{name:'Estância Horizonte',x:65,y:-48,cash:18000,ai:true,color:'#6f9eb1'},{name:'Cabanha Santa Fé',x:-62,y:60,cash:14000,ai:true,color:'#c98c81'},{name:'Agro Vale',x:65,y:60,cash:16000,ai:true,color:'#d4bb76'},{name:'Rincão Verde',x:0,y:65,cash:12000,ai:true,color:'#91ad72'}];const defs={house:{w:12,h:10,cost:4000},stable:{w:17,h:10,cost:3200},barn:{w:16,h:13,cost:2400},paddock:{w:20,h:16,cost:1300}};const buildings=[],trees=[],horses=[],ponds=[{x:-105,y:4,rx:16,ry:10},{x:112,y:12,rx:19,ry:12}],fields=[{x:-112,y:-82,w:32,h:20},{x:110,y:93,w:29,h:19},{x:12,y:-89,w:30,h:22}];function free(x,y,w,h){if(Math.abs(x)+w/2>135||Math.abs(y)+h/2>115)return false;return !buildings.some(b=>Math.abs(x-b.x)<(w+b.w)/2+4&&Math.abs(y-b.y)<(h+b.h)/2+4)}function add(o,type,x,y,charge=true){const d=defs[type];if(!free(x,y,d.w,d.h)||(charge&&o.cash<d.cost))return false;if(charge)o.cash-=d.cost;buildings.push({o,type,x,y,w:d.w,h:d.h});return true}owners.forEach(o=>{add(o,'house',o.x,o.y,false);add(o,'stable',o.x+22,o.y,false);add(o,'paddock',o.x,o.y+23,false);for(let i=0;i<3;i++)horses.push({o,phase:rnd()*7,offset:i*3})});for(let i=0;i<370;i++){let x=rnd()*280-140,y=rnd()*240-120;if(owners.some(o=>Math.abs(x-o.x)<38&&Math.abs(y-o.y)<36))continue;trees.push({x,y,s:.7+rnd()*.7})}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function screen(x,y){const s=Math.min(W/300,H/260)*zoom;return{x:W/2+(x-panX)*s,y:H/2+(y-panY)*s*.67}}function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function poly(points,c){ctx.fillStyle=c;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()}function drawBuilding(b){const p=screen(b.x,b.y),s=Math.min(W/300,H/260)*zoom,w=b.w*s,h=b.h*s*.67;let x=p.x-w/2,y=p.y-h/2;const roof=b.type==='house'?'#9a5643':b.type==='stable'?'#6b4538':'#83705d';if(b.type==='paddock'){rect(x,y,w,h,'#a3b875');ctx.strokeStyle='#e4d4a5';ctx.lineWidth=Math.max(2,s*.65);ctx.strokeRect(x,y,w,h);for(let k=1;k<5;k++){let xx=x+w*k/5;rect(xx,y-2,2,6,'#e4d4a5');rect(xx,y+h-3,2,6,'#e4d4a5')}return}rect(x+3,y+5,w,h,'#806c51');rect(x,y,w,h,b.o.color);poly([[x-3,y+2],[x+w/2,y-h*.48],[x+w+3,y+2],[x+w,y+h*.18],[x,y+h*.18]],roof);rect(x+w*.12,y+h*.4,w*.18,h*.28,'#4d716e');rect(x+w*.67,y+h*.36,w*.22,h*.64,'#5c4533');ctx.strokeStyle='#e2c69d';ctx.lineWidth=1.5;ctx.strokeRect(x+w*.12,y+h*.4,w*.18,h*.28)}
function drawLandscape(){const s=Math.min(W/300,H/260)*zoom;for(const field of fields){let p=screen(field.x,field.y),w=field.w*s,h=field.h*s*.67;rect(p.x-w/2,p.y-h/2,w,h,'#b4a36c');for(let i=1;i<8;i++){ctx.strokeStyle=i%2?'#68884a':'#d4bf7a';ctx.lineWidth=Math.max(1,s*.9);ctx.beginPath();ctx.moveTo(p.x-w/2+i*w/8,p.y-h/2);ctx.lineTo(p.x-w/2+i*w/8,p.y+h/2);ctx.stroke()}}for(const lake of ponds){let p=screen(lake.x,lake.y);ctx.fillStyle='#5d9ba0';ctx.beginPath();ctx.ellipse(p.x,p.y,lake.rx*s,lake.ry*s*.67,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#c1c792';ctx.lineWidth=2;ctx.stroke()}}function drawTree(t){let p=screen(t.x,t.y),s=Math.min(W/300,H/260)*zoom*t.s;rect(p.x-1*s,p.y,2*s,5*s,'#755338');ctx.fillStyle='#467a41';ctx.beginPath();ctx.arc(p.x,p.y-2*s,4*s,0,Math.PI*2);ctx.fill();ctx.fillStyle='#689951';ctx.beginPath();ctx.arc(p.x-1*s,p.y-3*s,2.5*s,0,Math.PI*2);ctx.fill()}
function render(){rect(0,0,W,H,'#86ad7d');const a=screen(-150,-130),b=screen(150,130);rect(a.x,a.y,b.x-a.x,b.y-a.y,'#89ad70');for(let k=-3;k<=3;k++){let p=screen(k*45,-130),q=screen(k*45,130);ctx.strokeStyle='#c4ad84';ctx.lineWidth=Math.max(3,Math.min(W/300,H/260)*zoom*3);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}for(let k=-2;k<=2;k++){let p=screen(-150,k*48),q=screen(150,k*48);ctx.strokeStyle='#c4ad84';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}for(const o of owners){let p=screen(o.x,o.y);ctx.strokeStyle=o.ai?'#d4e6a6':'#fff0a8';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.beginPath();ctx.ellipse(p.x,p.y,31*Math.min(W/300,H/260)*zoom,28*Math.min(W/300,H/260)*zoom*.67,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}const objects=[...trees.map(t=>({y:t.y,draw:()=>drawTree(t)})),...buildings.map(b=>({y:b.y,draw:()=>drawBuilding(b)})),...horses.map(h=>({y:h.o.y+12+Math.sin(h.phase)*5,draw:()=>{let p=screen(h.o.x+Math.cos(h.phase)*9+h.offset,h.o.y+12+Math.sin(h.phase)*5),s=Math.min(W/300,H/260)*zoom;rect(p.x-2*s,p.y-2*s,5*s,2.5*s,'#795038');rect(p.x+2*s,p.y-4*s,2*s,3*s,'#795038');rect(p.x-1*s,p.y,1*s,2*s,'#4b3328');rect(p.x+2*s,p.y,1*s,2*s,'#4b3328')}}))];objects.sort((a,b)=>a.y-b.y).forEach(o=>o.draw());for(let o of owners){let p=screen(o.x,o.y-25),scale=Math.min(W/300,H/260)*zoom;ctx.font='bold '+Math.max(10,Math.min(14,scale*8))+'px system-ui';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#173625';ctx.strokeText(o.name,p.x,p.y);ctx.fillStyle='#fff9df';ctx.fillText(o.name,p.x,p.y)}}
function refresh(){$('date').textContent='📅 Dia '+day;$('money').textContent='💰 R$ '+owners[0].cash.toLocaleString('pt-BR');$('buildings').textContent='🏡 '+buildings.length+' estruturas · 4 IAs'}function tick(){day+=5;for(let o of owners){o.cash+=180+buildings.filter(b=>b.o===o).length*20;if(!o.ai||rnd()>.5)continue;let types=o.name.includes('Agro')?['barn','paddock','barn']:o.name.includes('Cabanha')?['stable','paddock','stable']:o.name.includes('Rincão')?['paddock','house','stable']:['stable','barn','house','paddock'],type=types[Math.floor(rnd()*types.length)];if(o.cash<defs[type].cost+3000)continue;for(let i=0;i<50;i++){let x=o.x+(rnd()-.5)*56,y=o.y+(rnd()-.5)*48;if(Math.hypot(x-o.x,y-o.y)<31&&!owners.some(other=>other!==o&&Math.hypot(x-other.x,y-other.y)<34)&&add(o,type,x,y)){ $('news').textContent=o.name+' construiu '+({stable:'uma cocheira',paddock:'um piquete',barn:'um galpão',house:'uma casa'}[type])+'.';break}}}refresh()}function save(){try{localStorage.setItem('fazenda-viva-v040',JSON.stringify({day,owners:owners.map(o=>o.cash),buildings:buildings.map(b=>({owner:owners.indexOf(b.o),type:b.type,x:b.x,y:b.y})),panX,panY,zoom}))}catch(e){}}function load(){try{let d=JSON.parse(localStorage.getItem('fazenda-viva-v040')||'null');if(!d)return;day=d.day||1;d.owners?.forEach((v,i)=>{if(owners[i])owners[i].cash=v});if(Array.isArray(d.buildings)&&d.buildings.length){buildings.length=0;for(let b of d.buildings){let o=owners[b.owner],def=defs[b.type];if(o&&def&&Number.isFinite(b.x)&&Number.isFinite(b.y))buildings.push({o,type:b.type,x:b.x,y:b.y,w:def.w,h:def.h})}}}catch(e){}}let prev=performance.now();function frame(now){try{let dt=Math.min(.05,(now-prev)/1000);prev=now;if(!paused){acc+=dt*speed;horses.forEach(h=>h.phase+=dt*speed*.4);if(acc>3){acc=0;tick();save()}}render()}catch(e){$('error').hidden=false;$('error').textContent='Erro de renderização: '+e.message;return}requestAnimationFrame(frame)}
let pointers=new Map(),moved=0,start=null;canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.85,Math.min(5.5,zoom*(e.deltaY>0?.9:1.1)))},{passive:false});canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;start={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointermove',e=>{let old=pointers.get(e.pointerId);if(!old)return;let dx=e.clientX-old.x,dy=e.clientY-old.y;moved+=Math.abs(dx)+Math.abs(dy);if(pointers.size===1){let s=Math.min(W/300,H/260)*zoom;panX-=dx/s;panY-=dy/(s*.67)}else if(pointers.size===2){let other=[...pointers].find(([id])=>id!==e.pointerId)?.[1];if(other){let before=Math.hypot(old.x-other.x,old.y-other.y),after=Math.hypot(e.clientX-other.x,e.clientY-other.y);if(before>10)zoom=Math.max(.85,Math.min(5.5,zoom*after/before))}}pointers.set(e.pointerId,{x:e.clientX,y:e.clientY})});canvas.addEventListener('pointerup',e=>{pointers.delete(e.pointerId);if(moved>10||!build)return;let s=Math.min(W/300,H/260)*zoom,x=(e.clientX-W/2)/s+panX,y=(e.clientY-H/2)/(s*.67)+panY,o=owners[0];if(Math.hypot(x-o.x,y-o.y)>31){$('status').textContent='⚠️ Construa dentro da sua propriedade';return}if(owners.slice(1).some(other=>Math.hypot(x-other.x,y-other.y)<32)){$('status').textContent='⚠️ Terreno pertence a outra fazenda';return}if(owners[0].cash<defs[build].cost){$('status').textContent='💰 Saldo insuficiente';return}if(add(o,build,x,y)){$('status').textContent='✅ Construção concluída';build=null;refresh();save()}else $('status').textContent='⚠️ Local ocupado: escolha outro espaço'});$('toggle').onclick=()=>{$('panel').hidden=!$('panel').hidden};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ Retomar':'⏸ Pausar'};$('speed').onclick=()=>{speed=speed===1?3:speed===3?8:1;$('speed').textContent='⏩ '+speed+'×'};$('focus').onclick=()=>{panX=-60;panY=-45;zoom=2.7;$('status').textContent='📷 Câmera centralizada na sua cabanha'};$('actions').onclick=e=>{let t=e.target.closest('[data-type]');if(t){build=t.dataset.type;$('panel').hidden=true;$('status').textContent='Toque no terreno para construir '+build}};panX=-58;panY=-43;load();refresh();requestAnimationFrame(frame);
})();
</script></body></html>
