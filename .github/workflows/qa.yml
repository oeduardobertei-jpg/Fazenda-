name: Fazenda Viva — Verificação automática
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências de teste
        run: npm ci
      - name: Simular jogo, conferir controle e integridade JS
        run: |
          npm test
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório e referência 0.9.9.2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências de teste
        run: npm ci
      - name: Instalar Chromium e bibliotecas de sistema
        run: npx playwright install --with-deps chromium
      - name: Testar WebGL real e interface em cinco viewports
        run: npm run test:browser
      - name: Guardar capturas e métricas para inspeção visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fazenda-viva-qa-0.9.9.3
          path: qa-artifacts/
          retention-days: 14
